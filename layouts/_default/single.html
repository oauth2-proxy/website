{{ define "main" }}
  <article class="article"><a class="back-link" href="{{ .Parent.RelPermalink }}">← Back to {{ .Parent.Title }}</a><div class="article-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>{{ with .Params.author }}<span aria-hidden="true">·</span><a class="article-author" href="{{ $.Params.author_url }}"><img src="{{ $.Params.author_avatar }}" alt="" width="24" height="24" loading="lazy">{{ . }}</a>{{ end }}</div><h1>{{ .Title }}</h1><div class="article-content">{{ .Content }}</div></article>
{{ end }}
